name: Probar el macro de ventas

on:
  pull_request:
    paths: ['mensajes/**', 'tests/**', '.github/workflows/test-mensajes.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Prueba de humo (PIN, tutorial, avisos, vistas, venta, respaldo y sin internet)
        run: node tests/mensajes.smoke.cjs
