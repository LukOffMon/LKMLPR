[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "highlyartmon"
version = "1.0.0"
description = "HighlyArtMon - local pixel-art studio that Claude can draw in and see, live."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
highlyartmon = "highlyartmon.__main__:main"

[tool.setuptools]
packages = ["highlyartmon"]

[tool.setuptools.package-data]
highlyartmon = ["ui/*", "guide.md"]
