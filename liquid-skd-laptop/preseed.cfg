#### Instalación automática de Debian 13 para la laptop de Liquid SKd
# Úsalo así: arranca la USB oficial de Debian 13 (netinst) → Advanced options → Automated install
# y, cuando pida «Location of initial preconfiguration file», escribe:
#   https://raw.githubusercontent.com/LukOffMon/LKMLPR/main/liquid-skd-laptop/preseed.cfg
#
# Solo te preguntará: tu contraseña (dos veces) y si borra el disco (UNA confirmación).
# ⚠️ BORRA TODO EL DISCO de la laptop donde lo uses.

### Idioma, país y teclado (español de México, teclado latinoamericano)
d-i debian-installer/language string es
d-i debian-installer/country string MX
d-i debian-installer/locale string es_MX.UTF-8
d-i keyboard-configuration/xkb-keymap select latam

### Red (cable): automática
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string liquid-skd
d-i netcfg/get_domain string
d-i netcfg/hostname string liquid-skd
d-i hw-detect/load_firmware boolean true

### Réplica de Debian
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Cuentas: sin root (el usuario usa sudo). Usuario «liquid»; la contraseña te la pide a ti
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Liquid
d-i passwd/username string liquid

### Hora
d-i clock-setup/utc boolean true
d-i time/zone string America/Mexico_City
d-i clock-setup/ntp boolean true

### Disco: todo el disco, una sola partición (pregunta UNA vez antes de borrar)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman-efi/non_efi_system boolean true
# partman/confirm NO está respondido a propósito: verás «¿Desea escribir los cambios en los discos?» → Sí

### Paquetes: sin escritorio; SSH y lo que necesita el protocolo
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl git ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Arranque
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### Al terminar: «liquid» con sudo, el protocolo ya descargado y un mensaje con los siguientes pasos
d-i preseed/late_command string \
  in-target usermod -aG sudo liquid; \
  in-target sh -c 'cd /home/liquid && git clone https://github.com/LukOffMon/LKMLPR.git && chown -R liquid:liquid LKMLPR'; \
  in-target sh -c 'sed -i "s/^GRUB_TIMEOUT=.*/GRUB_TIMEOUT=3/" /etc/default/grub && update-grub'; \
  in-target sh -c 'printf "\n  Liquid SKd · laptop lista\n\n  1) Instala Claude Code:   curl -fsSL https://claude.ai/install.sh | bash\n  2) Vuelve a entrar y:      cd ~/LKMLPR/liquid-skd-laptop && claude remote-control\n  3) Pide a Claude:          Sigue PROTOCOLO.md\n     (o sin Claude:          bash instalar.sh)\n\n" > /etc/motd'

d-i finish-install/reboot_in_progress note
